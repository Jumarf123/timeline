[package]
name = "timeline"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Fast local viewer for large CSV, JSON and log files"
build = "build.rs"
default-run = "timeline"

[dependencies]
anyhow = "1"
csv = "1.3"
tao = "0.34"
wry = "0.54"
chrono = { version = "0.4", default-features = false, features = ["std"] }
encoding_rs = "0.8"
memchr = "2"
regex = "1.11"
rfd = "0.15"
roaring = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
